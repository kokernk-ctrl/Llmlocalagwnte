name: Android release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdk=$RUNNER_TEMP/forge-android-sdk
          archive=$RUNNER_TEMP/forge-android-tools.zip
          mkdir -p "$sdk/cmdline-tools"
          curl -fLSs --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$archive"
          printf '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  %s\n' "$archive" | sha256sum -c
          unzip -q "$archive" -d "$RUNNER_TEMP/forge-android-unpack"
          mv "$RUNNER_TEMP/forge-android-unpack/cmdline-tools" "$sdk/cmdline-tools/12.0"
          manager=$sdk/cmdline-tools/12.0/bin/sdkmanager
          # sdkmanager closes stdin after accepting licenses, so `yes` can receive SIGPIPE.
          (set +o pipefail; yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null)
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintRelease assembleRelease
      - name: Sign and verify APK
        env:
          FORGE_KEYSTORE_B64: ${{ secrets.FORGE_KEYSTORE_B64 }}
          FORGE_KEYSTORE_PASSWORD: ${{ secrets.FORGE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          key=$(mktemp "$RUNNER_TEMP/forge-signing.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FORGE_KEYSTORE_B64" | base64 --decode > "$key"
          tools=$ANDROID_HOME/build-tools/35.0.0
          mkdir -p release
          apk=FORGE-AI-${version}-release.apk
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/forge-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias forge-release --ks-pass env:FORGE_KEYSTORE_PASSWORD \
            --out "release/$apk" "$RUNNER_TEMP/forge-aligned.apk"
          "$tools/zipalign" -c -P 16 4 "release/$apk"
          badging=$("$tools/aapt2" dump badging "release/$apk")
          grep -F "versionName='$version'" <<< "$badging"
          ! grep -q '^application-debuggable' <<< "$badging"
          scripts/verify_apk.sh "release/$apk"
          (cd release && sha256sum "$apk" > "$apk.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          apk=FORGE-AI-${version}-release.apk
          gh release create "$GITHUB_REF_NAME" "release/$apk" "release/$apk.sha256" \
            --verify-tag --title "FORGE AI $version" \
            --notes 'APK Android assinado. 0.3.0: agente de programação local com leitura e escrita reais em pasta autorizada (SAF, diff, verificação pós-gravação, checkpoints), aba Shell com comandos locais sob lista de permissões e runtime Python embutido (Chaquopy, sem Termux), além do chat local Qwen2 via llama.cpp e ferramentas manuais de pasta. Sem rede, sem root, sem pesos embutidos; execução livre de Python exige aprovação explícita. Android 8+ (ARM64 ou x86_64).'
